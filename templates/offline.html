{% extends "base.html" %}

{% block title %}Offline // VaultSwap{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center py-8 px-4">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 text-center shadow-2xl backdrop-blur-md space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-slate-800/80 border border-slate-700/80 flex items-center justify-center text-amber-400 shadow-inner">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-5.636-2.678m0 0a9 9 0 010-12.728m0 0l2.829 2.829M8.464 15.536a5 5 0 010-7.072m0 0l2.829 2.829M3 3l18 18" />
            </svg>
        </div>

        <div class="space-y-2">
            <h1 class="text-xl font-bold tracking-tight text-white">You're Currently Offline</h1>
            <p class="text-xs text-slate-400 leading-relaxed max-w-xs mx-auto">
                VaultSwap couldn't reach the server. Any previously opened binder views remain stored on your device.
            </p>
        </div>

        <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
            <button onclick="window.location.reload()"
                class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold text-xs tracking-wide transition shadow-lg shadow-emerald-500/20 active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Retry Connection</span>
            </button>
            <a href="{{ url_for('binder_view') if current_user else url_for('login_page') }}"
                class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs tracking-wide transition border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                <span>View Cached Binder</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
